services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Medusa Server (API + Admin)
  medusa-server:
    build:
      context: ./medusa
      dockerfile: Dockerfile
    container_name: medusa_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa}@postgres:5432/${POSTGRES_DB:-medusa}
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - STORE_CORS=${STORE_CORS:-http://localhost:8000,http://localhost:3000}
      - ADMIN_CORS=${ADMIN_CORS:-http://localhost:9000}
      - AUTH_CORS=${AUTH_CORS:-http://localhost:9000,http://localhost:8000}
      - MEDUSA_WORKER_MODE=server
      - BACKEND_URL=${BACKEND_URL:-http://localhost:9000}
      - DISABLE_ADMIN=false
      # Razorpay
      - RAZORPAY_ID=${RAZORPAY_ID:-}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET:-}
      - RAZORPAY_ACCOUNT=${RAZORPAY_ACCOUNT:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      # Cloudflare R2 file storage
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-medusa-media}
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # Medusa Worker (background jobs)
  medusa-worker:
    build:
      context: ./medusa
      dockerfile: Dockerfile
    container_name: medusa_worker
    restart: unless-stopped
    depends_on:
      medusa-server:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa}@postgres:5432/${POSTGRES_DB:-medusa}
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - MEDUSA_WORKER_MODE=worker
      - BACKEND_URL=${BACKEND_URL:-http://localhost:9000}
      - DISABLE_ADMIN=true
      # Razorpay
      - RAZORPAY_ID=${RAZORPAY_ID:-}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET:-}
      - RAZORPAY_ACCOUNT=${RAZORPAY_ACCOUNT:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      # Cloudflare R2 file storage
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-medusa-media}
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
